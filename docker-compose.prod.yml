name: film
services:
  frontend-build:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in root .env}/film-frontend:latest
    volumes:
      - frontend_dist:/frontend-dist
    restart: "no"
    networks: [film_network]

  backend:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in root .env}/film-backend:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOGGER_FORMAT: ${LOGGER_FORMAT:-json}
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://postgres:5432/${DATABASE_NAME:-films}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-film_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in root .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [film_network]

  nginx:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in root .env}/film-nginx:latest
    ports: ["80:80"]
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped
    networks: [film_network]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-films}
      POSTGRES_USER: ${DATABASE_USERNAME:-film_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks: [film_network]

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in root .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in root .env}
    ports: ["8080:80"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [film_network]

networks:
  film_network:
    driver: bridge
volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:
